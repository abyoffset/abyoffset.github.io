<!DOCTYPE html>
<html lang="in">
<head>
    <meta charset="UTF-8">
    <title>Tiviku - Smart TV</title>
    <style>
        /* --- GAYA UTAMA & CARD --- */
        body {
            background-color: black;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }

        h1 { display: none; }
        b { display: none; }

        .re {
            color: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            font-weight: 1000;
            font-style: italic;
            position: relative;
            letter-spacing: 1px;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            padding: 5px;
            font-size: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .dur {
            color: white;
            font-weight: 900;
            font-style: italic;
            position: absolute;
            border-radius: 3px;
            bottom: 180px;
            padding: 3px;
            background-color: rgba(0, 0, 0, 0.6);
            font-size: 15px;
            z-index: 1;
        }

        .responsive-div:focus .re,
        .responsive-div:hover .re {
            font-size: 19px;
            color: white;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .responsive-div:focus,
        .responsive-div:hover,
        .highlight {
            border: 5px solid #fff !important; 
            border-radius: 13px;
            outline: none;
        }

        #imgv {                
            border-radius: 11px;
            width: 270px;
            height: 220px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }

        #atas {                
            position: relative;
            height: 80px; 
            color: yellowgreen;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #container {
            height: calc(100vh - 100px); 
            position: relative;
            top: 15px;
            padding: 0px;
            overflow: auto; 
        }

        .responsive-div {
            width: 260px;
            height: 210px;
            display: inline-block; 
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 13px;
            overflow: hidden;
            position: relative;
            padding: 8px 8px;
            margin: 15px;
            border: 5px solid #6c7c13; 
        }

        /* --- LAYOUT DUA KOLOM (SIDEBAR) --- */
        #app-wrapper {
            display: flex;
            height: 100vh;
            background-color: black;
            transition: background-color 0.3s;
        }

        #sidebar {
            width: 250px;
            background-color: #0c0c0c;
            padding: 20px 0;
            flex-shrink: 0;
            border-right: 2px solid #282828;
            text-align: left;
            transition: background-color 0.3s;
        }

        #logo-search {
            padding: 0 20px 20px;
        }

        #sidebar-h1 { 
            color: yellowgreen; 
            font-size: 32px;
            margin: 0;
            font-family: inherit;
            font-weight: 700;
        }

        #sidebar-b { 
            color: yellowgreen; 
            display: block;
            margin-top: 0px;
            font-size: 30px; 
            font-weight: bold; 
        }

        #sidebar #cari {
            width: 100%;
            height: 40px;
            border-radius: 8px;
            background: #333;
            border: none;
            padding: 0 15px;
            font-size: 18px;
            color: white;
            outline: none;
            box-sizing: border-box;
            margin-top: 15px; 
        }

        #nav-menu {
            margin-top: 30px;
        }

        .nav-item {
            padding: 15px 20px;
            font-size: 18px;
            color: #aaa;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .nav-item:focus,
        .nav-item:hover {
            background-color: #333;
            color: white;
            outline: none;
        }

        #main-content {
            flex-grow: 1;
            overflow: hidden; 
            position: relative;
            padding: 0 20px; 
        }

        /* --- JAM DIGITAL --- */
        #digital-clock {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 20px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* --- OFFLINE MESSAGE --- */
        #offline-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffcccc; 
            background-color: rgba(50, 0, 0, 0.9);
            padding: 30px 40px;
            border-radius: 15px;
            border: 3px solid red;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            z-index: 100;
            text-align: center;
            font-size: 24px;
            line-height: 1.5;
        }

        /* --- PENGATURAN MENU --- */
        #pengaturan-menu {
            height: calc(100vh - 100px); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        #theme-options {
            display: flex;
            gap: 30px;
            margin-top: 40px;
        }

        .theme-button {
            padding: 15px 30px;
            font-size: 18px;
            border: 3px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: transform 0.2s;
            margin: 5px;
        }

        .theme-button:focus,
        .theme-button:hover {
            outline: none;
            transform: scale(1.05);
        }

        .theme-button[data-theme="default"] { background-color: #2c2c2c; border-color: yellowgreen; }
        .theme-button[data-theme="blue-dark"] { background-color: #0d1a2c; border-color: #4a90e2; }
        .theme-button[data-theme="red-dark"] { background-color: #3d0a0a; border-color: #ff4d4d; }

        /* --- TEMA WARNA --- */
        .theme-blue-dark { background-color: #121c29 !important; }
        .theme-blue-dark #sidebar { background-color: #0b141d !important; border-right-color: #1e2a39 !important; }
        .theme-blue-dark #sidebar #cari { background: #1e2a39 !important; }
        .theme-blue-dark .responsive-div { border: 5px solid #4a90e2 !important; }

        .theme-red-dark { background-color: #1f0505 !important; }
        .theme-red-dark #sidebar { background-color: #150000 !important; border-right-color: #330000 !important; }
        .theme-red-dark #sidebar #cari { background: #330000 !important; }
        .theme-red-dark .responsive-div { border: 5px solid #ff4d4d !important; }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div id="sidebar">
            <div id="logo-search">
                <h1 id="sidebar-h1">tiviku</h1>
                <b id="sidebar-b">tiviku</b>
                <input type="text" id="cari" placeholder="cari...">
            </div>
            
            <div id="nav-menu">
                <div class="nav-item focus-target" tabindex="0" data-page="beranda">🏠 Beranda</div>
                <div class="nav-item focus-target" tabindex="0" data-page="koleksi">📁 Koleksi</div>
                <div class="nav-item focus-target" tabindex="0" data-page="pengaturan">🛠️ Pengaturan</div>
            </div>
        </div>

        <div id="main-content">
            <div id="digital-clock"></div> 
            <div id="atas"></div> 
            <div id="container"></div>

            <div id="pengaturan-menu" style="display: none;">
                <h2>🎨 Pilih Tema Aplikasi</h2>
                <div id="theme-options">
                    <button class="theme-button focus-target" tabindex="0" data-theme="default">Default</button>
                    <button class="theme-button focus-target" tabindex="0" data-theme="blue-dark">Biru Tua</button>
                    <button class="theme-button focus-target" tabindex="0" data-theme="red-dark">Merah Gelap</button>
                </div>
                <div id="app-version-info" style="margin-top: 50px; color: white;"></div>
            </div>
        </div>
    </div>
    
    <div id="offline-message" style="display: none;">
        ❌ **TIDAK ADA KONEKSI INTERNET** ❌<br>Daftar film gagal dimuat.
    </div>

    <script>
        const APP_VERSION = 'v2.0.0'; 
        const indexJsonUrl = 'index.json';
        const container = document.getElementById('container');
        const headerTitle = document.getElementById('atas');
        const pengaturanMenu = document.getElementById('pengaturan-menu');
        const searchInput = document.getElementById('cari');

        let allGlobalItems = [];
        let currentItems = [];
        let isDataLoaded = false;

        // --- MANAJEMEN TEMA ---
        function applyTheme(themeName) {
            const appWrapper = document.getElementById('app-wrapper');
            document.body.classList.remove('theme-blue-dark', 'theme-red-dark');
            appWrapper.classList.remove('theme-blue-dark', 'theme-red-dark'); 

            if (themeName !== 'default') {
                document.body.classList.add(`theme-${themeName}`);
                appWrapper.classList.add(`theme-${themeName}`);
            }
            try { localStorage.setItem('currentTheme', themeName); } catch (e) {}
        }

        function loadInitialTheme() {
            applyTheme(localStorage.getItem('currentTheme') || 'default');
        }

        // --- JAM DIGITAL ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const clockElement = document.getElementById('digital-clock');
            if (clockElement) clockElement.innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- LAZY LOADING GAMBAR ---
        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target.querySelector('.lazy-img'); 
                    if (img && img.getAttribute('data-src')) {
                        img.src = img.getAttribute('data-src'); 
                        img.removeAttribute('data-src');
                        observer.unobserve(entry.target); 
                    }
                }
            });
        }, { root: container, rootMargin: '100px 0px', threshold: 0.01 });

        function createFilmElement(item, clickAction, isCollection = false) {
            const img = document.createElement('img');
            img.id = 'imgv';
            img.setAttribute('data-src', item.logo); 
            img.src = 'data:image/svg+xml;charset=utf-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="270" height="220"%3E%3Crect width="100%25" height="100%25" fill="%231a1a1a"%3E%3C/rect%3E%3C/svg%3E'; 
            img.classList.add('lazy-img'); 

            const pp = document.createElement('p');
            pp.className = 're';
            pp.innerText = item.ttl;

            const dur = document.createElement('p');
            dur.className = 'dur';
            dur.innerText = isCollection ? 'Koleksi (klik)' : (item.dur || '');

            const dv = document.createElement('div');
            dv.className = 'responsive-div';
            dv.tabIndex = 0; 
            dv.onclick = clickAction;

            dv.appendChild(img);
            dv.appendChild(pp);
            dv.appendChild(dur);
            container.appendChild(dv);
            
            imageObserver.observe(dv);
            return dv; 
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // --- FETCH DATA GLOBAL ---
        function fetchAllData(callback) {
            if (isDataLoaded) {
                if (callback) callback();
                return;
            }

            container.innerHTML = '<h2>Memuat Konten...</h2>';
            fetch(indexJsonUrl)
                .then(res => res.json())
                .then(indexData => {
                    const directFiles = indexData.source_list || [];
                    if (directFiles.length === 0) {
                        isDataLoaded = true;
                        if (callback) callback();
                        return;
                    }

                    let processed = 0;
                    allGlobalItems = [];

                    directFiles.forEach(fileUrl => {
                        fetch(fileUrl)
                            .then(res => res.json())
                            .then(data => {
                                function extract(entries) {
                                    if (!Array.isArray(entries)) return;
                                    entries.forEach(entry => {
                                        if (entry.koleksi || entry.lnk) allGlobalItems.push(entry);
                                        for (let key in entry) {
                                            if (Array.isArray(entry[key])) extract(entry[key]);
                                        }
                                    });
                                }
                                extract(data);
                                processed++;
                                if (processed === directFiles.length) {
                                    isDataLoaded = true;
                                    if (callback) callback();
                                }
                            })
                            .catch(() => {
                                processed++;
                                if (processed === directFiles.length) {
                                    isDataLoaded = true;
                                    if (callback) callback();
                                }
                            });
                    });
                })
                .catch(() => {
                    container.innerHTML = '<h2>❌ Gagal memuat index.json</h2>';
                });
        }

        // --- RENDER HALAMAN BERANDA ---
        function renderBeranda() {
            container.style.display = 'block';
            pengaturanMenu.style.display = 'none';
            headerTitle.style.display = 'none';

            fetchAllData(() => {
                let homeItems = allGlobalItems.filter(item => item.lnk);
                shuffleArray(homeItems);
                currentItems = homeItems;
                renderItems(false);
            });
        }

        // --- RENDER HALAMAN UTAMA KOLEKSI (Daftar Folder Koleksi) ---
        function renderKoleksiMenu() {
            container.style.display = 'block';
            pengaturanMenu.style.display = 'none';
            headerTitle.style.display = 'flex';
            headerTitle.innerText = "PILIH KOLEKSI";

            fetchAllData(() => {
                const groups = {};
                allGlobalItems.forEach(item => {
                    if (item.koleksi) {
                        if (!groups[item.koleksi]) groups[item.koleksi] = [];
                        groups[item.koleksi].push(item);
                    }
                });

                currentItems = [];
                Object.keys(groups).forEach(key => {
                    const list = groups[key];
                    const sample = list[Math.floor(Math.random() * list.length)];
                    currentItems.push({
                        logo: sample.logo,
                        ttl: key,
                        koleksi: key,
                        type: 'collection-folder'
                    });
                });

                renderItems(true);
            });
        }

        // --- RENDER ISI DALAM SUATU KOLEKSI ---
        function renderDetailKoleksi(collectionKey, collectionTitle) {
            container.style.display = 'block';
            pengaturanMenu.style.display = 'none';
            headerTitle.style.display = 'flex';
            headerTitle.innerText = collectionTitle.toUpperCase();

            fetchAllData(() => {
                let items = allGlobalItems.filter(item => item.koleksi && item.koleksi.toLowerCase() === collectionKey.toLowerCase());
                
                if (items.some(i => i.episode !== undefined)) {
                    items.sort((a, b) => (parseInt(a.episode) || 0) - (parseInt(b.episode) || 0));
                } else {
                    shuffleArray(items);
                }
                currentItems = items;
                renderItems(false);
            });
        }

        // --- RENDER PENGATURAN ---
        function renderPengaturan() {
            container.style.display = 'none';
            headerTitle.style.display = 'none';
            pengaturanMenu.style.display = 'flex';
            document.getElementById('app-version-info').innerHTML = `Versi Aplikasi: <b>${APP_VERSION}</b>`;
            
            const firstBtn = document.querySelector('.theme-button');
            if (firstBtn) firstBtn.focus();
        }

        // --- EKsekusi RENDER DOM ---
        function renderItems(isCollectionFolder) {
            container.innerHTML = '';
            if (currentItems.length === 0) {
                container.innerHTML = '<h2>Tidak ada konten.</h2>';
                return;
            }

            currentItems.forEach(item => {
                let action;
                let isColLabel = false;

                if (isCollectionFolder) {
                    action = () => renderDetailKoleksi(item.koleksi, item.ttl);
                    isColLabel = true;
                } else if (item.lnk) {
                    action = () => {
                        sessionStorage.setItem('videoLink', item.lnk);
                        sessionStorage.setItem('videoTitle', item.ttl);
                        sessionStorage.setItem('logoFile', item.logo);
                        sessionStorage.setItem('videoCropMode', item.crop_mode || 'fill');
                        sessionStorage.setItem('videoCropPosition', item.crop_position || '50% 50%');
                        sessionStorage.setItem('videoCropScale', item.crop_scale || '');
                        window.location.href = 'p.html';
                    };
                } else {
                    action = () => renderDetailKoleksi(item.koleksi, item.ttl);
                    isColLabel = true;
                }
                createFilmElement(item, action, isColLabel);
            });

            const firstDiv = document.querySelector('.responsive-div');
            if (firstDiv) {
                firstDiv.classList.add('highlight');
                firstDiv.focus();
            }
        }

        // --- PENCARIAN LIVE ---
        searchInput.addEventListener("input", () => {
            const filter = searchInput.value.toLowerCase();
            document.querySelectorAll('.responsive-div').forEach(div => {
                const text = div.querySelector('.re').innerText.toLowerCase();
                if (text.includes(filter)) {
                    div.style.display = "";
                    const img = div.querySelector('.lazy-img');
                    if (img && img.getAttribute('data-src')) {
                        img.src = img.getAttribute('data-src');
                        img.removeAttribute('data-src');
                    }
                } else {
                    div.style.display = "none";
                }
            });
        });

        // --- NAVIGASI REMOTE & KEYBOARD ---
        document.addEventListener('keydown', (e) => {
            const focused = document.activeElement;
            if (['ArrowUp', 'ArrowDown', 'ArrowRight', 'ArrowLeft', 'Enter'].includes(e.key)) {
                e.preventDefault();

                if (focused.classList.contains('theme-button')) {
                    const buttons = Array.from(document.querySelectorAll('.theme-button'));
                    let idx = buttons.indexOf(focused);
                    if (e.key === 'ArrowRight') buttons[Math.min(idx + 1, buttons.length - 1)].focus();
                    if (e.key === 'ArrowLeft') buttons[Math.max(idx - 1, 0)].focus();
                    if (e.key === 'ArrowUp') document.querySelector('.nav-item[data-page="pengaturan"]').focus();
                    if (e.key === 'Enter') focused.click();
                    return;
                }

                if (focused.classList.contains('nav-item')) {
                    const navs = Array.from(document.querySelectorAll('.nav-item'));
                    let idx = navs.indexOf(focused);
                    if (e.key === 'ArrowDown') navs[Math.min(idx + 1, navs.length - 1)].focus();
                    if (e.key === 'ArrowUp') {
                        if (idx === 0) searchInput.focus();
                        else navs[Math.max(idx - 1, 0)].focus();
                    }
                    if (e.key === 'ArrowRight') {
                        if (focused.dataset.page === 'pengaturan') {
                            document.querySelector('.theme-button').focus();
                        } else {
                            const firstDiv = document.querySelector('.responsive-div:not([style*="display: none"])');
                            if (firstDiv) { firstDiv.classList.add('highlight'); firstDiv.focus(); }
                        }
                    }
                    if (e.key === 'Enter') {
                        const page = focused.dataset.page;
                        if (page === 'beranda') renderBeranda();
                        else if (page === 'koleksi') renderKoleksiMenu();
                        else if (page === 'pengaturan') renderPengaturan();
                    }
                    return;
                }

                if (focused === searchInput) {
                    if (e.key === 'ArrowDown') document.querySelector('.nav-item').focus();
                    if (e.key === 'ArrowRight') {
                        const firstDiv = document.querySelector('.responsive-div:not([style*="display: none"])');
                        if (firstDiv) { firstDiv.classList.add('highlight'); firstDiv.focus(); }
                    }
                    return;
                }

                // Navigasi Grid Card
                const divs = Array.from(document.querySelectorAll('.responsive-div')).filter(d => getComputedStyle(d).display !== 'none');
                let idx = divs.indexOf(focused);
                if (idx === -1) return;

                divs[idx].classList.remove('highlight');
                const containerRect = container.getBoundingClientRect();
                const itemsPerRow = Math.max(1, Math.floor(containerRect.width / (divs[0].offsetWidth + 30)));
                let nextIdx = idx;

                if (e.key === 'ArrowDown') nextIdx = Math.min(idx + itemsPerRow, divs.length - 1);
                if (e.key === 'ArrowUp') {
                    nextIdx = idx - itemsPerRow;
                    if (nextIdx < 0) { searchInput.focus(); return; }
                }
                if (e.key === 'ArrowRight') nextIdx = Math.min(idx + 1, divs.length - 1);
                if (e.key === 'ArrowLeft') {
                    nextIdx = idx - 1;
                    if (nextIdx < 0 || idx % itemsPerRow === 0) {
                        document.querySelector('.nav-item').focus();
                        return;
                    }
                }
                if (e.key === 'Enter') {
                    focused.click();
                    return;
                }

                if (divs[nextIdx]) {
                    divs[nextIdx].classList.add('highlight');
                    divs[nextIdx].focus();
                    divs[nextIdx].scrollIntoView({ behavior: 'instant', block: 'center' });
                }
            }
        });

        // --- INISIALISASI AWAL ---
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;
                if (page === 'beranda') renderBeranda();
                else if (page === 'koleksi') renderKoleksiMenu();
                else if (page === 'pengaturan') renderPengaturan();
            });
        });

        loadInitialTheme();
        renderBeranda(); // Default buka halaman Beranda
    </script>
</body>
</html>
