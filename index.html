<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        /* --- RESET & BASE STYLE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #080810;
            overflow: hidden;
        }

        /* --- SPLASH SCREEN CONTAINER --- */
        .splash-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 9999;
            background-color: #080810;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Efek transisi mengecil ke tengah (shutter) */
            transition: clip-path 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            clip-path: circle(100% at 50% 50%);
        }

        /* --- KONTEN DI TENGAH --- */
        .splash-content {
            text-align: center;
            position: relative;
            transition: transform 0.5s ease, opacity 0.4s ease;
        }

        /* Efek Lingkaran Glow Berputar di Belakang Logo */
        .logo-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-container::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(138, 43, 226, 0.4); /* Warna Ungu/Violet */
            animation: rotateGlow 8s linear infinite;
        }

        /* Animasi Logo Berdegup (Pulse) */
        .logo-box img {
            max-width: 120px;
            height: auto;
            animation: pulseGlow 2s ease-in-out infinite alternate;
            z-index: 2;
            position: relative;
        }

        /* --- TEKS PERSENTASE --- */
        .loading-text {
            color: #ffffff;
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 30px;
            font-weight: 300;
            opacity: 0.8;
        }
        #percentage {
            font-weight: 600;
            color: #8a2be2; /* Aksentasi ungu */
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        /* --- PROGRESS BAR UNDERLINE --- */
        .loading-bar-container {
            width: 150px;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            margin: 15px auto 0 auto;
            border-radius: 20px;
            overflow: hidden;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #4a00e0); /* Gradasi Ungu ke Biru gelap */
            box-shadow: 0 0 12px #8a2be2;
            animation: fillBar 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* --- KEYFRAMES ANIMASI --- */
        @keyframes rotateGlow {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.96);
                filter: drop-shadow(0 0 5px rgba(138, 43, 226, 0.3));
            }
            100% {
                transform: scale(1.04);
                filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.8));
            }
        }

        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- TRIGGER KELUAR (PORTAL MENUTUP KELUAR) --- */
        .splash-wrapper.hide {
            clip-path: circle(0% at 50% 50%); /* Efek menyusut ke tengah */
            opacity: 0;
        }
        .splash-wrapper.hide .splash-content {
            transform: scale(0.7);
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN LAYER -->
    <div class="splash-wrapper" id="splashWrapper">
        <div class="splash-content">
            
            <!-- Logo dengan Lingkaran Glow -->
            <div class="logo-container">
                <div class="logo-box">
                    <!-- Ganti 'logo.png' dengan file gambar logomu -->
                    <img src="logo.png" alt="Logo">
                </div>
            </div>

            <!-- Teks Persentase -->
            <div class="loading-text">memuat <span id="percentage">0%</span></div>

            <!-- Progress Bar -->
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
            
        </div>
    </div>

    <!-- JAVASCRIPT ANIMASI DAN REDIRECT -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const percentText = document.getElementById('percentage');
            let count = 0;
            const duration = 2300; // Sedikit di bawah waktu total splash agar angka selesai duluan
            const intervalTime = duration / 100;

            // Logika Counter Angka 0-100%
            const counter = setInterval(() => {
                count++;
                percentText.textContent = count + "%";
                if (count >= 100) {
                    clearInterval(counter);
                }
            }, intervalTime);

            // Menunggu seluruh proses loading (2.5 Detik)
            setTimeout(function() {
                const wrapper = document.getElementById('splashWrapper');
                
                // Picu animasi keluar (portal menyusut ke tengah)
                wrapper.classList.add('hide'); 
                
                // Tunggu transisi selesai (0.8 detik), lalu pindah halaman
                setTimeout(() => {
                    window.location.replace("index1.html"); 
                }, 800);

            }, 2500);
        });
    </script>
</body>
</html>
