<!DOCTYPE html>
<html lang="in">
<head>
    <meta charset="UTF-8">
    <title>Tiviku - Koleksi Detail</title>
    <style>
        /* --- GAYA ASLI HALAMAN KOLEKSI --- */
        body {
            background-color: black;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }

        h1 {
            display: none; 
        }
        b {
            display: none;
        }

        .re {
            color: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            font-weight: 1000;
            font-style: italic;
            position: relative;
            letter-spacing: 1px;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            padding: 5px;
            font-size: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .dur {
            color: white;
            font-weight: 900;
            font-style: italic;
            position: absolute;
            border-radius: 3px;
            bottom: 180px;
            padding: 3px;
            background-color: rgba(0, 0, 0, 0.6);
            font-size: 15px;
            z-index: 1;
        }

        .responsive-div:focus .re,
        .responsive-div:hover .re {
            font-size: 19px;
            color: white;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .responsive-div:focus {
            border: 5px solid #fff; 
            border-radius: 13px;
            outline: none;
        }

        .responsive-div:hover {
            border: 5px solid #fff;
            border-radius: 13px;
        }

        .highlight {
            border: 5px solid #fff;
            border-radius: 13px;
            outline: none;
        }

        #imgv {                
            border-radius: 11px;
            width: 270px;
            height: 220px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }

        #atas {                
            position: relative;
            height: 80px; 
            color: yellowgreen;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #container {
            height: calc(100vh - 100px); 
            position: relative;
            top: 15px;
            padding: 0px;
            overflow: auto; 
        }

        .responsive-div {
            width: 260px;
            height: 210px;
            display: inline-block; 
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 13px;
            overflow: hidden;
            position: relative;
            padding: 8px 8px;
            margin: 15px;
            border: 5px solid #6c7c13; 
        }

        #app-wrapper {
            display: flex;
            height: 100vh;
            background-color: black;
            transition: background-color 0.3s;
        }

        #sidebar {
            width: 250px;
            background-color: #0c0c0c;
            padding: 20px 0;
            flex-shrink: 0;
            border-right: 2px solid #282828;
            text-align: left;
            transition: background-color 0.3s;
        }

        #logo-search {
            padding: 0 20px 20px;
        }

        #sidebar-h1 { 
            color: yellowgreen; 
            font-size: 32px;
            margin: 0;
            font-family: inherit;
            font-weight: 700;
        }

        #sidebar-b { 
            color: yellowgreen; 
            display: block;
            margin-top: 0px;
            font-size: 30px; 
            font-weight: bold; 
        }

        #sidebar #cari {
            width: 100%;
            height: 40px;
            border-radius: 8px;
            background: #333;
            border: none;
            padding: 0 15px;
            font-size: 18px;
            color: white;
            outline: none;
            box-sizing: border-box;
            margin-top: 15px; 
        }

        #nav-menu {
            margin-top: 30px;
        }

        .nav-item {
            padding: 15px 20px;
            font-size: 18px;
            color: #aaa;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .nav-item:focus,
        .nav-item:hover {
            background-color: #333;
            color: white;
            outline: none;
        }

        #main-content {
            flex-grow: 1;
            overflow: hidden; 
            position: relative;
            padding: 0 20px; 
        }

        #digital-clock {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 20px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* Tema Pendukung */
        .theme-blue-dark {
            background-color: #121c29 !important;
        }
        .theme-blue-dark #sidebar {
            background-color: #0b141d !important;
            border-right-color: #1e2a39 !important;
        }
        .theme-blue-dark #sidebar #cari {
            background: #1e2a39 !important;
        }
        .theme-blue-dark .responsive-div {
            border: 5px solid #4a90e2 !important;
        }
        .theme-blue-dark .responsive-div:focus,
        .theme-blue-dark .highlight {
            border: 5px solid white !important; 
            box-shadow: 0 0 15px #4a90e2;
        }

        .theme-red-dark {
            background-color: #1f0505 !important;
        }
        .theme-red-dark #sidebar {
            background-color: #150000 !important;
            border-right-color: #330000 !important;
        }
        .theme-red-dark #sidebar #cari {
            background: #330000 !important;
        }
        .theme-red-dark .responsive-div {
            border: 5px solid #ff4d4d !important;
        }
        .theme-red-dark .responsive-div:focus,
        .theme-red-dark .highlight {
            border: 5px solid white !important;
            box-shadow: 0 0 15px #ff4d4d;
        }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div id="sidebar">
            <div id="logo-search">
                <h1 id="sidebar-h1">tiviku</h1>
                <b id="sidebar-b">tiviku</b>
                <input type="text" name="" id="cari" placeholder="cari...">
            </div>
            
            <div id="nav-menu">
                <div class="nav-item focus-target" tabindex="0" data-page="kembali">⬅️ Kembali</div>
            </div>
        </div>

        <div id="main-content">
            <div id="digital-clock"></div> 
            <div id="atas"></div> 
            <div id="container"></div>
        </div>
    </div>

    <script>
        const indexJsonUrl = 'index.json';
        const container = document.getElementById('container');
        const atas = document.getElementById('atas');
        
        let collectionItems = [];
        let currentItems = [];

        function getLocalStorage(name) {
            try { return localStorage.getItem(name); } catch (e) { return null; }
        }

        function applyTheme(themeName) {
            const appWrapper = document.getElementById('app-wrapper');
            document.body.classList.remove('theme-blue-dark', 'theme-red-dark');
            appWrapper.classList.remove('theme-blue-dark', 'theme-red-dark'); 
            if (themeName !== 'default') {
                document.body.classList.add(`theme-${themeName}`);
                appWrapper.classList.add(`theme-${themeName}`);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target.querySelector('.lazy-img'); 
                    if (img && img.getAttribute('data-src')) {
                        img.src = img.getAttribute('data-src'); 
                        img.removeAttribute('data-src');
                        observer.unobserve(entry.target); 
                    }
                }
            });
        }, { root: container, rootMargin: '100px 0px', threshold: 0.01 });

        function createFilmElement(item) {
            const img = document.createElement('img');
            img.id = 'imgv';
            img.setAttribute('data-src', item.logo); 
            img.src = 'data:image/svg+xml;charset=utf-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="270" height="220" viewBox="0 0 270 220"%3E%3Crect width="100%25" height="100%25" fill="%231a1a1a"%3E%3C/rect%3E%3C/svg%3E'; 
            img.classList.add('lazy-img'); 

            const pp = document.createElement('p');
            pp.className = 're';
            pp.innerText = item.ttl;

            const dur = document.createElement('p');
            dur.className = 'dur';
            dur.innerText = item.dur || '';

            const dv = document.createElement('div');
            dv.className = 'responsive-div';
            dv.tabIndex = 0; 
            dv.onclick = () => {
                sessionStorage.setItem('lastFocusedCardTitle', item.ttl);
                playVideo(item.lnk, item.logo, item.ttl, item.crop_mode, item.crop_position, item.crop_scale);
            };

            dv.appendChild(img);
            dv.appendChild(pp);
            dv.appendChild(dur);
            container.appendChild(dv);
            
            imageObserver.observe(dv);
            return dv; 
        }

        function loadCollectionContent() {
            const collectionKey = sessionStorage.getItem('currentCollectionKey');
            const collectionTitle = sessionStorage.getItem('currentCollectionTitle');
            
            if (collectionTitle) {
                atas.innerText = collectionTitle;
            }

            fetch(indexJsonUrl)
                .then(res => res.json())
                .then(indexData => {
                    const sourceList = indexData.source_list || [];
                    let promises = sourceList.map(fileUrl => fetch(fileUrl).then(res => res.json()).catch(() => []));

                    Promise.all(promises).then(results => {
                        let allItems = [];
                        results.forEach(dataArray => {
                            if (Array.isArray(dataArray)) {
                                dataArray.forEach(item => {
                                    if (item.koleksi === collectionKey) {
                                        allItems.push(item);
                                    }
                                });
                            }
                        });

                        // --- ATURAN PENGURUTAN KOLEKSI ---
                        // Pisahkan item yang memiliki episode dan yang tidak
                        let episodicItems = allItems.filter(item => item.episode !== undefined && item.episode !== null && item.episode !== '');
                        let normalItems = allItems.filter(item => item.episode === undefined || item.episode === null || item.episode === '');

                        // Urutkan item ber-episode dari kecil ke besar (mulai dari 1, tidak diacak)
                        episodicItems.sort((a, b) => {
                            let epA = parseInt(a.episode, 10);
                            let epB = parseInt(b.episode, 10);
                            return (isNaN(epA) ? 0 : epA) - (isNaN(epB) ? 0 : epB);
                        });

                        // Acak item yang tidak memiliki episode
                        shuffleArray(normalItems);

                        // Gabungkan: Episode urut dari 1 di atas, diikuti item tanpa episode yang diacak
                        currentItems = [...episodicItems, ...normalItems];

                        renderCurrentItems();
                    });
                })
                .catch(err => {
                    container.innerHTML = '<h2>❌ Gagal memuat data koleksi</h2>';
                });
        }

        function renderCurrentItems() {
            container.innerHTML = ''; 
            currentItems.forEach(item => {
                createFilmElement(item);
            });
            restoreFocus();
        }

        function playVideo(videoFile, logoFile, textFile, cropMode, cropPosition, cropScale) { 
            sessionStorage.setItem('videoLink', videoFile);
            sessionStorage.setItem('videoTitle', textFile);
            sessionStorage.setItem('logoFile', logoFile);
            sessionStorage.setItem('videoCropMode', cropMode || 'fill'); 
            sessionStorage.setItem('videoCropPosition', cropPosition || '50% 50%'); 
            sessionStorage.setItem('videoCropScale', cropScale || ''); 
            window.location.href = 'p.html';
        }

        function restoreFocus() {
            const lastTitle = sessionStorage.getItem('lastFocusedCardTitle');
            let target = null;
            if (lastTitle) {
                document.querySelectorAll('.responsive-div').forEach(div => {
                    if (div.querySelector('.re').innerText === lastTitle) target = div;
                });
            }
            if (!target) target = container.querySelector('.responsive-div');
            if (target) {
                target.classList.add('highlight');
                target.focus();
            } else {
                document.querySelector('.nav-item').focus();
            }
        }

        document.getElementById("cari").addEventListener("input", (e) => {
            const filter = e.target.value.toLowerCase();
            document.querySelectorAll('.responsive-div').forEach(div => {
                const text = div.querySelector('.re').innerText.toLowerCase();
                div.style.display = text.includes(filter) ? "" : "none";
            });
        });

        document.addEventListener('keydown', (e) => {
            const searchInput = document.getElementById("cari");
            const focused = document.activeElement;

            if (['ArrowUp', 'ArrowDown', 'ArrowRight', 'ArrowLeft', 'Enter'].includes(e.key)) {
                e.preventDefault();

                if (focused.classList.contains('nav-item')) {
                    if (e.key === 'ArrowRight') {
                        const firstDiv = container.querySelector('.responsive-div:not([style*="display: none"])');
                        if (firstDiv) {
                            firstDiv.classList.add('highlight');
                            firstDiv.focus();
                        }
                    } else if (e.key === 'Enter') {
                        window.location.href = 'index.html'; // Sesuaikan halaman utama Anda jika berbeda
                    }
                    return;
                }

                if (focused === searchInput) {
                    if (e.key === 'ArrowDown') {
                        document.querySelector('.nav-item').focus();
                    } else if (e.key === 'ArrowRight') {
                        const firstDiv = container.querySelector('.responsive-div:not([style*="display: none"])');
                        if (firstDiv) {
                            firstDiv.classList.add('highlight');
                            firstDiv.focus();
                        }
                    }
                    return;
                }

                const divs = Array.from(document.querySelectorAll('.responsive-div')).filter(d => getComputedStyle(d).display !== 'none');
                const idx = divs.indexOf(focused);
                if (divs.length === 0 || idx === -1) return;

                let nextIdx = -1;
                const itemsPerRow = Math.floor(container.clientWidth / (divs[0].offsetWidth + 30)) || 1;

                divs[idx].classList.remove('highlight');

                switch (e.key) {
                    case 'ArrowDown':
                        nextIdx = Math.min(idx + itemsPerRow, divs.length - 1);
                        break;
                    case 'ArrowUp':
                        nextIdx = idx - itemsPerRow;
                        if (nextIdx < 0) {
                            searchInput.focus();
                            return;
                        }
                        break;
                    case 'ArrowRight':
                        nextIdx = Math.min(idx + 1, divs.length - 1);
                        break;
                    case 'ArrowLeft':
                        nextIdx = idx - 1;
                        if (nextIdx < 0 || (idx % itemsPerRow === 0)) {
                            document.querySelector('.nav-item').focus();
                            return;
                        }
                        break;
                    case 'Enter':
                        focused.click();
                        return;
                }

                if (nextIdx !== -1 && divs[nextIdx]) {
                    divs[nextIdx].classList.add('highlight');
                    divs[nextIdx].focus();
                    sessionStorage.setItem('lastFocusedCardTitle', divs[nextIdx].querySelector('.re').innerText);
                    divs[nextIdx].scrollIntoView({ behavior: 'instant', block: 'center' });
                }
            }
        });

        // Inisialisasi awal halaman koleksi
        applyTheme(getLocalStorage('currentTheme') || 'default');
        loadCollectionContent();
        setInterval(() => {
            const now = new Date();
            const clock = document.getElementById('digital-clock');
            if (clock) clock.innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
