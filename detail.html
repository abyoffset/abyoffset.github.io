<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Film - tiviku app</title>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1a0f0f; color: #fff; }
        .container { max-width: 600px; margin: auto; padding-bottom: 20px;}
        
        /* Backdrop 16:9 - overflow: visible agar poster bisa menumpuk ke bawah */
        .backdrop-container { position: relative; width: 100%; aspect-ratio: 16/9; overflow: visible; background-color: #0f0f12;}
        .backdrop-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(40%); }
        
        /* Poster: Ditarik ke atas (bottom negatif) agar menumpuk di atas info */
        .poster-container { 
            position: absolute; 
            left: 20px; 
            bottom: -50px; 
            width: 110px; 
            z-index: 10; 
        }
        .poster-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); background-color: #222;}
        
        /* Info: Padding-top ditambah agar tidak tertabrak poster */
        .info-section { padding: 60px 20px 20px 20px; }
        h1 { margin: 0; font-size: 1.4rem; padding-left: 120px; min-height: 50px; line-height: 1.3;} 
        
        .score-row { display: flex; align-items: center; margin: 12px 0; gap: 15px; }
        .score-circle { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #20c997; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; }
        
        .meta-row { margin: 12px 0; color: #ccc; font-size: 0.9rem; }
        .genre { font-weight: bold; color: #fff; font-size: 0.95rem; margin-bottom: 15px;}
        
        .synopsis-section { padding: 0 20px; }
        h2 { font-size: 1.1rem; margin-bottom: 8px; }
        p { line-height: 1.5; color: #ddd; font-size: 0.95rem; }
        
        /* Tombol Play yang menonjol */
        .play-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e50914; 
            color: #fff;
            padding: 14px;
            margin: 25px 20px 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            transition: background 0.2s;
        }
        .play-button:hover { background: #ff1e27; }
        
        .nav-bar { display: flex; justify-content: space-around; padding: 12px; background: #0a0a0a; position: fixed; width: 100%; max-width: 600px; bottom: 0; font-size: 0.9rem; color: #aaa; box-sizing: border-box;}
        .spacer { height: 60px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tombol kembali -->
        <div style="position: absolute; top: 15px; left: 15px; z-index: 20; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.9rem;" onclick="window.location.href='index2.html'">
            ← Kembali
        </div>

        <div class="backdrop-container">
            <img id="backdrop" src="" class="backdrop-img" alt="Backdrop">
            <div class="poster-container">
                <img id="poster" src="" class="poster-img" alt="Poster">
            </div>
        </div>

        <div class="info-section">
            <h1 id="title">Memuat Judul...</h1>
            <div class="score-row">
                <div class="score-circle" id="score">--%</div>
                <div>Skor<br>Pengguna</div>
                <div style="margin-left: 15px; border-left: 1px solid #555; padding-left: 15px; font-size: 0.9rem;">What's your <b>Vibe?</b></div>
            </div>
            
            <div class="meta-row">
                <span id="rating" style="border: 1px solid #ccc; padding: 1px 4px; border-radius: 3px; font-size: 0.8rem;">HD</span>
                <span id="meta" style="margin-left: 8px;"></span>
            </div>
            <div class="genre" id="genre">Kategori</div>
        </div>

        <!-- Tombol Play -->
        <div class="play-button" id="playBtn">
            ▶ TONTON SEKARANG
        </div>

        <div class="synopsis-section">
            <h2>Kilasan Singkat</h2>
            <p id="synopsis">Memuat kilasan singkat...</p>
        </div>
        
        <div class="spacer"></div>
        <div class="nav-bar">
            <span>List</span><span>Heart</span><span>Bookmark</span><span>Star</span>
        </div>
    </div>

    <!-- SCRIPT IKLAN ADSTERRA (Hanya aktif di halaman detail ini) -->
    <script src="https://pl30775961.effectivecpmnetwork.com/d4/08/d1/d408d1c2d38eb5ffb20c4b45bd9cff56.js"></script>

    <script>
        const movieDataStr = localStorage.getItem('selectedMovie');
        
        if (movieDataStr) {
            const data = JSON.parse(movieDataStr);
            
            document.getElementById('backdrop').src = data.backdrop || data.logo || ''; 
            document.getElementById('poster').src = data.logo || '';
            
            let prefixTitle = (data.episode) ? `Ep. ${data.episode} ` : '';
            let judul = data.ttl || 'Tanpa Judul';
            document.getElementById('title').innerText = prefixTitle + judul + (data.thn ? ' (' + data.thn + ')' : '');
            
            document.getElementById('score').innerText = data.score ? data.score + '%' : '85%';
            document.getElementById('meta').innerText = (data.thn || '202x') + ' • ' + (data.dur || 'N/A');
            
            let genreText = data.koleksi || 'General';
            if (data.bahasa) genreText += ` • ${data.bahasa}`;
            document.getElementById('genre').innerText = genreText;
            
            document.getElementById('synopsis').innerText = data.kilasan || 'Tidak ada deskripsi tersedia untuk film ini.';
        } else {
            document.getElementById('title').innerText = "Data tidak ditemukan";
            document.getElementById('synopsis').innerText = "Kembali ke beranda untuk memilih film.";
            document.getElementById('playBtn').style.display = 'none';
        }

        document.getElementById('playBtn').addEventListener('click', () => {
            window.location.href = 'index2.html?play=true';
        });
    </script>
</body>
</html>
