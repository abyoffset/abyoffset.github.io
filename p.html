<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiviku - Pemutar Video</title>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --accent-color: #e50914;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-page-wrapper {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 15px;
    }

    .back-btn {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      background: #333;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      border: 1px solid #24242a;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    video#videoPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .player-logo {
      position: absolute;
      top: 12px;
      left: 16px;
      width: 90px;
      height: 45px;
      object-fit: contain;
      z-index: 25;
      pointer-events: none;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.7));
      opacity: 0.85;
    }

    .player-details {
      padding: 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .player-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="player-page-wrapper">
    <button class="back-btn" onclick="window.location.href='index.html'">← Kembali ke Beranda</button>

    <div class="video-container" id="videoContainer">
      <div class="video-wrapper">
        <video id="videoPlayer" controls playsinline></video>
      </div>
      <img src="https://i.imgur.com/KsWH0uL.png" alt="Logo" class="player-logo">
    </div>

    <div class="player-details">
      <div id="playingTitle" class="player-title">Memuat Judul...</div>
    </div>
  </div>

  <script>
    const SECURE_KEY_BASE64 = "sFVdj5Nkt4n9Pbe+xuo70g==";

    function _decode(str) {
      try {
        if (!str || !/[A-Za-z0-9+/=]+$/.test(str)) return str;
        return decodeURIComponent(atob(str));
      } catch (e) {
        return str;
      }
    }

    const movieDataStr = sessionStorage.getItem('currentMovie');
    if (!movieDataStr) {
      alert("Tidak ada film yang dipilih!");
      window.location.href = "index.html";
    }

    const movie = JSON.parse(movieDataStr);
    document.getElementById('playingTitle').innerText = movie.ttl || 'Video Pemutar';

    const videoPlayer = document.getElementById('videoPlayer');
    const streamUrl = _decode(movie.lnk);

    if (Hls.isSupported()) {
      const hls = new Hls({
        xhrSetup: function (xhr, url) {
          if (url.includes("tiviku_system.bin") || url.includes(".key")) {
            const originalOpen = xhr.open;
            xhr.open = function(method, url, async, user, password) {
              originalOpen.call(this, 'GET', 'data:application/octet-stream;base64,' + SECURE_KEY_BASE64, async, user, password);
            };
          }
        }
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(videoPlayer);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        videoPlayer.play().catch(() => {});
      });
    } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
      videoPlayer.src = streamUrl;
      videoPlayer.addEventListener('loadedmetadata', () => {
        videoPlayer.play().catch(() => {});
      });
    }
  </script>
</body>
</html>
