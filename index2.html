<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tiviku app - Beranda</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0f12">

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --accent-color: #e50914;
      --accent-hover: #ff1e27;
      --text-color: #ffffff;
      --text-secondary: #a0a0a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 30px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    body::-webkit-scrollbar,
    .drawer-content::-webkit-scrollbar {
      display: none;
    }

    header {
      background-color: rgba(15, 15, 18, 0.95);
      padding: 15px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .hamburger-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .hamburger-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--accent-color);
    }

    .logo-title {
      font-size: 1.6rem;
      font-weight: 900;
      font-style: italic;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
      filter: drop-shadow(0 2px 8px rgba(229, 9, 20, 0.4));
      cursor: pointer;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      fill: var(--text-secondary);
      cursor: pointer;
    }

    .search-box {
      padding: 9px 34px 9px 36px;
      border-radius: 20px;
      border: 1px solid #333;
      background-color: #1a1a1e;
      color: #fff;
      outline: none;
      width: 200px;
      transition: width 0.3s ease, border-color 0.3s ease;
      font-size: 0.88rem;
    }

    .search-box:focus {
      width: 240px;
      border-color: var(--accent-color);
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
      padding: 2px;
    }

    .search-clear-btn.show {
      display: block;
    }

    /* DRAWER MENU */
    .drawer-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 800;
      backdrop-filter: blur(4px);
    }

    .drawer-overlay.active {
      display: block;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100%;
      background: var(--card-bg);
      z-index: 900;
      box-shadow: 5px 0 25px rgba(0,0,0,0.8);
      border-right: 1px solid #2a2a30;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .drawer.active {
      left: 0;
    }

    .drawer-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a30;
    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .drawer-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .drawer-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #121215;
      border: 1px solid #24242a;
      color: var(--text-color);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
      width: 100%;
      text-decoration: none;
      margin-bottom: 8px;
    }

    .drawer-item:hover {
      background-color: #1a1a20;
      border-color: rgba(229, 9, 20, 0.5);
    }

    .drawer-footer {
      padding: 16px 20px;
      border-top: 1px solid #2a2a30;
      font-size: 0.78rem;
      color: var(--text-secondary);
      text-align: center;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 950;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #2a2a30;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .container {
      max-width: 1280px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .section-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .current-filter-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }

    .movie-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid #24242a;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .movie-card:hover {
      transform: translateY(-4px);
      border-color: rgba(229, 9, 20, 0.6);
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      padding-top: 145%;
      background-color: #121215;
    }

    .poster-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 4px;
    }

    .movie-info {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .movie-title {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #e0e0e0;
    }

    @media (max-width: 600px) {
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
      }
      .search-box { width: 100%; }
      .search-wrapper { width: 100%; }
      .header-actions { width: 100%; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Header -->
  <header>
    <div class="header-left">
      <button class="hamburger-btn" onclick="toggleDrawer()" title="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div class="logo-title" onclick="location.reload()">tiviku app</div>
    </div>
    
    <div class="header-actions">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" class="search-box" placeholder="Cari ...">
        <button id="searchClearBtn" class="search-clear-btn" onclick="clearSearchInput()">✕</button>
      </div>
    </div>
  </header>

  <!-- Drawer / Sidebar Menu -->
  <div id="drawerOverlay" class="drawer-overlay" onclick="toggleDrawer()"></div>
  <div id="appDrawer" class="drawer">
    <div class="drawer-header">
      <div class="drawer-title">Menu Utama</div>
      <button class="drawer-close" onclick="toggleDrawer()">✕</button>
    </div>
    <div class="drawer-content">
      <div class="drawer-section">
        <div style="font-size: 0.78rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; margin-bottom: 10px;">Navigasi</div>
        <a href="index.html" class="drawer-item">🏠 Beranda</a>
        <a href="koleksi.html" class="drawer-item">📂 Lihat Berdasarkan Koleksi</a>
      </div>
    </div>
    <div class="drawer-footer">tiviku v2.5 &bull; by,C</div>
  </div>

  <!-- Custom Alert Modal -->
  <div id="customAlertModal" class="modal">
    <div class="modal-content">
      <h3 id="customAlertTitle">Informasi</h3>
      <p id="customAlertMessage" style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5;"></p>
      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 5px;">
        <button class="btn" onclick="closeCustomAlert()">OK</button>
      </div>
    </div>
  </div>

  <!-- Grid Utama -->
  <div class="container">
    <div class="section-info-bar">
      <span id="currentFilterTitle" class="current-filter-title">Semua Koleksi</span>
    </div>
    <div id="movieGrid" class="movie-grid"></div>
  </div>

  <script>
    const customAlertModal = document.getElementById('customAlertModal');
    function showCustomAlert(title, message) {
      document.getElementById('customAlertTitle').innerText = title;
      document.getElementById('customAlertMessage').innerHTML = message;
      customAlertModal.classList.add('active');
    }
    function closeCustomAlert() { customAlertModal.classList.remove('active'); }

    function toggleDrawer() {
      document.getElementById('appDrawer').classList.toggle('active');
      document.getElementById('drawerOverlay').classList.toggle('active');
    }

    function shuffleArray(array) {
      let shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    let currentData = [];
    const movieGrid = document.getElementById('movieGrid');
    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');

    function renderMovies(data) {
      movieGrid.innerHTML = '';
      if (!data || data.length === 0) {
        movieGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px 0;">Tidak ada data film.</p>';
        return;
      }

      const fragment = document.createDocumentFragment();
      data.forEach((movie) => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <div class="poster-wrapper">
            <img src="${movie.logo || ''}" alt="${movie.ttl}" loading="lazy">
            <span class="duration-badge">${movie.dur || 'N/A'}</span>
          </div>
          <div class="movie-info">
            <div class="movie-title">${movie.ttl || 'Tanpa Judul'}</div>
          </div>
        `;
        card.onclick = () => {
          // Simpan data film yang dipilih ke localStorage lalu buka player.html
          localStorage.setItem('tiviku_selected_movie', JSON.stringify(movie));
          window.location.href = 'player.html';
        };
        fragment.appendChild(card);
      });
      movieGrid.appendChild(fragment);
    }

    async function loadAutoSourceList() {
      try {
        const response = await fetch("https://abyoffset.github.io/index.json");
        if (!response.ok) throw new Error("Gagal mengambil data index.json");
        
        const rootJson = await response.json();
        let sourceFiles = rootJson.source_list || [];

        let allMovies = [];
        for (const fileUrl of sourceFiles) {
          try {
            const subRes = await fetch(fileUrl);
            if (subRes.ok) {
              const subData = await subRes.json();
              if (Array.isArray(subData)) allMovies = allMovies.concat(subData);
              else if (typeof subData === 'object' && subData !== null) allMovies.push(subData);
            }
          } catch (e) {
            console.error(`Gagal memuat file cabang: ${fileUrl}`, e);
          }
        }

        if (allMovies.length > 0) {
          currentData = allMovies;
          // Simpan master data ke localStorage agar bisa diakses halaman lain
          localStorage.setItem('tiviku_all_data', JSON.stringify(currentData));
          renderMovies(shuffleArray(currentData));
        } else {
          renderMovies([]);
        }
      } catch (err) {
        console.error("Gagal memuat otomatis:", err.message);
        renderMovies([]);
      }
    }

    function executeSearch(query) {
      const trimmedQuery = query.trim().toLowerCase();
      if (trimmedQuery.length > 0) searchClearBtn.classList.add('show');
      else searchClearBtn.classList.remove('show');

      if (!trimmedQuery) {
        renderMovies(shuffleArray(currentData));
        return;
      }

      const matched = currentData.filter(movie => (movie.ttl || '').toLowerCase().includes(trimmedQuery));
      renderMovies(matched);
    }

    function clearSearchInput() {
      searchInput.value = '';
      searchClearBtn.classList.remove('show');
      renderMovies(shuffleArray(currentData));
    }

    searchInput.addEventListener('input', (e) => {
      executeSearch(e.target.value);
    });

    window.onload = () => {
      loadAutoSourceList();
    };
  </script>
</body>
</html>
