<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tiviku app - Koleksi</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0f12">

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --accent-color: #e50914;
      --accent-hover: #ff1e27;
      --text-color: #ffffff;
      --text-secondary: #a0a0a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 30px;
    }

    header {
      background-color: rgba(15, 15, 18, 0.95);
      padding: 15px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .logo-title {
      font-size: 1.6rem;
      font-weight: 900;
      font-style: italic;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .container {
      max-width: 1280px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .koleksi-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    .koleksi-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid #24242a;
      color: var(--text-color);
      padding: 16px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .koleksi-btn:hover {
      background-color: #1a1a20;
      border-color: var(--accent-color);
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }

    .movie-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid #24242a;
      transition: transform 0.15s ease;
    }

    .movie-card:hover {
      transform: translateY(-4px);
      border-color: rgba(229, 9, 20, 0.6);
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      padding-top: 145%;
      background-color: #121215;
    }

    .poster-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 0.72rem;
      padding: 3px 7px;
      border-radius: 4px;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-title {
      font-size: 0.88rem;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #e0e0e0;
    }

    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 20px;
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="logo-title" onclick="location.href='index2.html'">tiviku app</div>
  </header>

  <div class="container">
    <a href="index2.html" class="back-link">&#8592; Kembali ke Beranda</a>
    <div class="section-title">Daftar Koleksi</div>
    
    <div id="koleksiMenuContainer" class="koleksi-list"></div>

    <div id="filterResultSection" style="display:none;">
      <div id="activeKoleksiTitle" style="font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: var(--text-secondary);"></div>
      <div id="movieGrid" class="movie-grid"></div>
    </div>
  </div>

  <script>
    const koleksiMenuContainer = document.getElementById('koleksiMenuContainer');
    const filterResultSection = document.getElementById('filterResultSection');
    const movieGrid = document.getElementById('movieGrid');
    const activeKoleksiTitle = document.getElementById('activeKoleksiTitle');

    function shuffleArray(array) {
      let shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function loadKoleksiData() {
      const storedData = localStorage.getItem('tiviku_all_data');
      if (!storedData) {
        koleksiMenuContainer.innerHTML = '<p style="color:#888;">Data tidak ditemukan. Silakan buka Beranda terlebih dahulu.</p>';
        return;
      }

      const allData = JSON.parse(storedData);
      const koleksiMap = new Map();

      allData.forEach(item => {
        if (item.koleksi) {
          koleksiMap.set(item.koleksi, (koleksiMap.get(item.koleksi) || 0) + 1);
        }
      });

      koleksiMenuContainer.innerHTML = '';
      koleksiMap.forEach((count, koleksiName) => {
        const btn = document.createElement('button');
        btn.className = 'koleksi-btn';
        btn.innerHTML = `<span>📂 ${koleksiName}</span> <span style="font-size:0.8rem; background:#222; padding:4px 10px; border-radius:12px; color:#aaa;">${count} Film</span>`;
        btn.onclick = () => showMoviesByKoleksi(allData, koleksiName);
        koleksiMenuContainer.appendChild(btn);
      });
    }

    function showMoviesByKoleksi(allData, koleksiName) {
      koleksiMenuContainer.style.display = 'none';
      filterResultSection.style.display = 'block';
      activeKoleksiTitle.innerHTML = `Koleksi: ${koleksiName} <button onclick="resetKoleksiView()" style="background:none; border:none; color:var(--accent-color); cursor:pointer; font-size:0.85rem; margin-left:15px;">✕ Pilih Koleksi Lain</button>`;

      let filtered = allData.filter(item => item.koleksi === koleksiName);
      const hasEpisode = filtered.some(item => item.episode !== undefined && item.episode !== null && item.episode !== "");

      if (hasEpisode) {
        filtered.sort((a, b) => (parseFloat(a.episode) || 0) - (parseFloat(b.episode) || 0));
      } else {
        filtered = shuffleArray(filtered);
      }

      movieGrid.innerHTML = '';
      filtered.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <div class="poster-wrapper">
            <img src="${movie.logo || ''}" alt="${movie.ttl}" loading="lazy">
            <span class="duration-badge">${movie.dur || 'N/A'}</span>
          </div>
          <div class="movie-info">
            <div class="movie-title">${movie.ttl || 'Tanpa Judul'}</div>
          </div>
        `;
        card.onclick = () => {
          localStorage.setItem('tiviku_selected_movie', JSON.stringify(movie));
          window.location.href = 'player2.html';
        };
        movieGrid.appendChild(card);
      });
    }

    function resetKoleksiView() {
      filterResultSection.style.display = 'none';
      koleksiMenuContainer.style.display = 'flex';
    }

    window.onload = loadKoleksiData;
  </script>
</body>
</html>
